services:
  db:
    image: postgres:16-alpine
    container_name: workout_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workout_tracker
    ports:
      - "5432:5432"
    volumes:
      - workout_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workout_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workout_pgdata: